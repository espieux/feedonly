# Builds an unsigned FeedOnly.ipa on a GitHub macOS runner.
# Sideloadly (or AltStore) signs it with your Apple ID when installing.
name: Build IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned app
        run: |
          xcodebuild -project FeedOnly.xcodeproj -scheme FeedOnly -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/FeedOnly.app Payload/
          zip -qr FeedOnly.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FeedOnly
          path: FeedOnly.ipa
