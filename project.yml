# XcodeGen spec: `xcodegen generate` turns this into FeedOnly.xcodeproj.
name: FeedOnly
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "16.0"
targets:
  FeedOnly:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: FeedOnly
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Take photos and videos to post or send in messages.
        NSPhotoLibraryUsageDescription: Choose photos and videos to post or send in messages.
        NSMicrophoneUsageDescription: Record videos and voice messages.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.feedonly
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    scheme: {}
